[build]
  command = "pnpm --filter @workspace/heicdrop run build"
  publish = "artifacts/heicdrop/dist/public"

[build.environment]
  NODE_VERSION = "22"
  BASE_PATH = "/"
  PORT = "8888"

[[redirects]]
  from = "/about"
  to = "/about/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact/index.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200